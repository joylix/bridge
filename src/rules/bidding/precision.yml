  - id: opener_1c_2nt_3c_3d_3nt
    description: "1C-2NT-3C-3D 后，开叫人 16+ 叫 3NT"
    sequence: "M:1C L:Pass P:2NT R:Pass M:3C L:Pass P:3D R:Pass"
    when: { hcp: "16+" }
