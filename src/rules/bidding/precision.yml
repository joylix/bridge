  - id: resp_1c_2nt_3c_3nt
    description: "1C-2NT-3C 后，11-13 均型叫 3NT"
    sequence: "P:1C R:Pass M:2NT L:Pass P:3C R:Pass"
    when: { hcp: "11-13", balanced: true, partnerOpened: true }
    action: "3NT"
    priority: 92

  - id: resp_1c_2nt_3c_5c
    description: "1C-2NT-3C 后，11-13 且 3+ 梅花进局 5C"
    sequence: "P:1C R:Pass M:2NT L:Pass P:3C R:Pass"
    when: { hcp: "11-13", clubs: "3+", partnerOpened: true }
