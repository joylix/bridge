  - id: opener_1c_2nt_3nt_default
    description: "1C-2NT 后，16+ 未命中自然再叫时叫 3NT"
    sequence: "M:1C L:Pass P:2NT R:Pass"
    when: { hcp: "16+" }
    action: "3NT"
