    priority: 85

  - id: resp_1c_2nt_bal
    description: "1C 后正应 2NT：11-13 均型"
    sequence: "P:1C R:Pass"
    when: { hcp: "11-13", balanced: true, partnerOpened: true }
    action: "2NT"
    priority: 84

  - id: opener_1c_2nt_3nt
    description: "1C-2NT 后，16-18 均型叫 3NT"
    sequence: "M:1C L:Pass P:2NT R:Pass"
    when: { hcp: "16-18", balanced: true }
    action: "3NT"
    priority: 94

  - id: opener_1c_2nt_4nt
    description: "1C-2NT 后，19-21 均型定量邀叫 4NT"
    sequence: "M:1C L:Pass P:2NT R:Pass"
    when: { hcp: "19-21", balanced: true }
