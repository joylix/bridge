# =====================================================================
# 防守信号约定（signals.yml）
# ---------------------------------------------------------------------
# 以下约定已由 ai/playAI.ts 实际执行（跟牌 / 垫牌启发式）：
#   - 第二家：通常出小牌；对手领出荣誉大牌（10 以上）时，
#     用最小能盖过的牌盖打，同伴领出的荣誉大牌不盖。
#   - 第三家：同伴的荣誉大牌已赢则出小牌；同伴的小牌当前虽赢但
#     第四家可能超过时，出最小能赢的牌保护；对手当前赢时同样出
#     最小能赢的牌（连张时保留更大牌）。
#   - 第四家：能赢则用最小赢张；同伴（第二家）已赢时不得无谓超打。
#   - 跟牌张数信号：偶数张“先大后小”，奇数张“先小后大”；
#     信号张只用 10 及以下，保留 J 以上大牌。
#   - 无将垫牌：从“不鼓励”（荣誉力量最弱）的花色垫最小牌。
#   - 有将垫牌：若某非将花色有力量且存在无损失的高信号张（8/9/10），
#     垫该张表示鼓励同伴攻此花色；否则回退到“不鼓励”花色垫最小牌。
# 首攻约定见 leads.yml（由 YAML 规则驱动）。
# =====================================================================

conventions:
  follow_play:
    description: "跟牌基本技巧"
    second_hand: "通常出小牌；对手领出荣誉大牌时用最小能盖过的牌盖打"
    third_hand: "同伴荣誉大牌已赢则出小牌；同伴小牌当前赢但可能被第四家超过时出高牌保护；对手赢时用最小赢张"
    fourth_hand: "能赢则用最小赢张；同伴已赢时不得无谓超打"

  follow_count:
    description: "跟牌张数信号"
    standard: "偶数张先大后小；奇数张先小后大"
    signal_cards: "只使用 10 及以下；J/Q/K/A 不作信号张"
    applies_to: "有将和无将一致"

  nt_discard:
    description: "无将垫牌"
    standard: "从不鼓励（最弱）的花色垫最小牌，表示不欢迎回攻该花色"

  suit_encourage_discard:
    description: "有将垫牌（无损失鼓励）"
    standard: "优先从有力量的非将花色垫 8/9/10 等高信号张，鼓励同伴攻此花色"
    fallback: "没有无损失信号张时，按无将垫牌逻辑从最弱花色垫最小牌"

  suit_preference:
    description: "花色选择信号（预留）"
    standard: "跟大牌 = 要求回较高级花色；跟小牌 = 较低级花色"
    note: "当前版本尚未单独实现，仅作文档记录"
